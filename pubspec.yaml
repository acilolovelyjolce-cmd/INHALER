name: whimsical_hub
description: "Cute product order and request manager for decorative inhaler keychains"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  collection: ^1.19.1
  confetti: ^0.8.0
  flutter_animate: ^4.5.2
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.1.0
  freezed_annotation: ^3.1.0
  go_router: ^15.1.2
  image: ^4.5.4
  image_picker: ^1.1.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  qr_flutter: ^4.1.0
  riverpod_annotation: ^2.6.1
  share_plus: ^10.1.4
  http: ^1.4.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  app_links: ^6.4.0
  uuid: ^4.5.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  flutter_lints: ^6.0.0
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true
  assets:
    - assets/doodles/
    - assets/doodles/cats/
    - assets/products/
    - assets/parts/
    - assets/branding/
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
